# Target IDE. Any IntelliJ-based IDE works (the plugin only depends on the platform module);
# Rider is the primary target. Override with -PplatformLocalPath="C:/Program Files/JetBrains/JetBrains Rider 2026.2.2"
# to build against a local installation instead of downloading the SDK.
platformVersion=2026.2.2
pluginGroup=com.ods.claudeusage
pluginVersion=1.1.0
pluginSinceBuild=252

kotlin.stdlib.default.dependency=false
kotlin.jvm.target.validation.mode=warning
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
